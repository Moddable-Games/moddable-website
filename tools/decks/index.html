<body>
<div id="nav-root"></div>

<div id="page-hero"></div>

<nav class="tools-jumpnav">
  <div class="tools-jumpnav__inner">
    <a href="#decks-designer" class="tools-jumpnav__link tools-jumpnav__link--green">Design</a>
    <a href="#decks-dealer" class="tools-jumpnav__link tools-jumpnav__link--blue">Shuffle &amp; Deal</a>
    <a href="#decks-presets" class="tools-jumpnav__link tools-jumpnav__link--red">Presets</a>
  </div>
</nav>

<section class="tools-body">
  <div class="tools-body__inner tools-body__inner--narrow">

    <div class="tool-card" id="decks-designer">
      <div class="tool-card__header">
        <div class="tool-card__accent tool-card__accent--green"></div>
        <div>
          <div class="tool-card__eyebrow tool-card__eyebrow--green">DESIGN</div>
          <h3 class="tool-card__title">Deck designer</h3>
          <p class="tool-card__desc">Add card types with names and quantities to build your custom deck.</p>
        </div>
      </div>
      <div id="deck-designer"></div>
    </div>

    <div class="tool-card" id="decks-dealer">
      <div class="tool-card__header">
        <div class="tool-card__accent tool-card__accent--blue"></div>
        <div>
          <div class="tool-card__eyebrow tool-card__eyebrow--blue">PLAY</div>
          <h3 class="tool-card__title">Shuffle &amp; Deal</h3>
          <p class="tool-card__desc">Shuffle the deck and deal hands to players. Reshuffle any time.</p>
        </div>
      </div>
      <div id="deck-dealer"></div>
    </div>

    <div class="tool-card" id="decks-presets">
      <div class="tool-card__header">
        <div class="tool-card__accent tool-card__accent--red"></div>
        <div>
          <div class="tool-card__eyebrow tool-card__eyebrow--red">PRESETS</div>
          <h3 class="tool-card__title">Preset decks</h3>
          <p class="tool-card__desc">Load a standard deck to get started quickly.</p>
        </div>
      </div>
      <div id="deck-presets"></div>
    </div>

  </div>
</section>

<div id="footer-root"></div>
<script type="module" src="../../js/mg-tools-decks-page.js?v=1.5.5"></script>
