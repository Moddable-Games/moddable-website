<body>
<div id="nav-root"></div>
<div id="dashboard-root"></div>
<div id="footer-root"></div>
<script type="module">
import { navbar, footer } from '../../../js/mg.js';
import * as State from '../../../js/mg-ti-dash-state.js';
import * as Setup from '../../../js/mg-ti-dash-setup.js';
import { render as renderScore } from '../../../js/mg-ti-dash-score.js';
document.getElementById('nav-root').appendChild(navbar('Tools'));
document.getElementById('footer-root').appendChild(footer());
(async () => {
  const root = document.getElementById('dashboard-root');
  await Setup.loadData();
  if (State.load()) {
    renderScore(root);
  } else {
    Setup.render(root);
  }
})();
</script>
</body>
