<body>
<div id="nav-root"></div>
<div id="dashboard-root"></div>
<div id="footer-root"></div>
<script src="../../../js/mg-loader.js?v=1.1.0"></script>
<script src="../../../js/mg-ti-dash-state.js?v=1.1.0"></script>
<script src="../../../js/mg-ti-dash-objectives.js?v=1.1.0"></script>
<script src="../../../js/mg-ti-dash-agenda.js?v=1.1.0"></script>
<script src="../../../js/mg-ti-dash-score.js?v=1.1.0"></script>
<script src="../../../js/mg-ti-dash-setup.js?v=1.1.0"></script>
<script>
const { navbar, footer } = MG;
document.getElementById('nav-root').appendChild(navbar('Tools'));
document.getElementById('footer-root').appendChild(footer());
(async () => {
  const root = document.getElementById('dashboard-root');
  await MG_TIDash_Setup.loadData();
  if (MG_TIDash_State.load()) {
    MG_TIDash_Score.render(root);
  } else {
    MG_TIDash_Setup.render(root);
  }
})();
</script>
